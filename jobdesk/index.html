<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Job Market Desk</title>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script>
/* Job Market Desk: GitHub Pages adapter.
   Gives the app the same small interface it uses on claude.ai (window.claude.use("db" | "sample" | "downloads")),
   backed by a JSON file in a private GitHub repo and by the DeepSeek API.
   Secrets (GitHub token, DeepSeek key) live only in this browser's localStorage. */
(() => {
"use strict";
const CFG_KEY = "jd-gh-config";
const DEFAULTS = { owner:"thuljp", repo:"jobdesk-data", branch:"main", path:"desk.json", token:"", dsKey:"", dsBase:"https://api.deepseek.com", dsModel:"deepseek-flash" };
function loadCfg(){ try { return {...DEFAULTS, ...JSON.parse(localStorage.getItem(CFG_KEY) || "{}")}; } catch { return {...DEFAULTS}; } }
function saveCfg(c){ try { localStorage.setItem(CFG_KEY, JSON.stringify(c)); } catch {} }
const cfg = loadCfg();
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- UTF-8 base64 ---------- */
function b64enc(str){ const bytes = new TextEncoder().encode(str); let bin = ""; for(let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(bin); }
function b64dec(b64){ const bin = atob(b64.replace(/\s/g, "")); const bytes = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i); return new TextDecoder().decode(bytes); }

/* ---------- Sync status in the top bar ---------- */
let statusText = "", statusKind = "";
function setStatus(text, kind){ statusText = text; statusKind = kind || ""; const el = document.getElementById("sync-state"); if(el){ el.textContent = text; el.dataset.kind = statusKind; } }
const hhmm = () => new Date().toLocaleTimeString("zh-CN", {hour:"2-digit", minute:"2-digit"});

/* ---------- GitHub-backed document store ---------- */
const COLLS = ["jobs","events","materials","qa","meta"];
function makeStore(c){
  const api = `https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${c.path.split("/").map(encodeURIComponent).join("/")}`;
  const H = {Authorization:"Bearer " + c.token, Accept:"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28"};
  let data = empty(), sha = null, etag = null;
  const pending = new Set(); const subs = {}; let timer = null, flushing = null, retryTimer = null;
  function empty(){ const d = {version:1}; COLLS.forEach(k => d[k] = {}); return d; }
  function norm(d){ const o = d && typeof d === "object" ? d : {}; COLLS.forEach(k => { if(!o[k] || typeof o[k] !== "object") o[k] = {}; }); return o; }
  async function getRemote(conditional){
    const h = {...H}; if(conditional && etag) h["If-None-Match"] = etag;
    const r = await fetch(`${api}?ref=${encodeURIComponent(c.branch)}`, {headers:h, cache:"no-store"});
    if(r.status === 304) return {status:304};
    if(r.status === 404) return {status:404};
    if(r.status === 401 || r.status === 403) throw {code:"auth", status:r.status, message:await r.text().catch(() => "")};
    if(!r.ok) throw {code:"http", status:r.status, message:await r.text().catch(() => "")};
    const j = await r.json(); const tag = r.headers.get("ETag");
    let text;
    if(j.content && j.encoding === "base64") text = b64dec(j.content);
    else { const raw = await fetch(`${api}?ref=${encodeURIComponent(c.branch)}`, {headers:{...H, Accept:"application/vnd.github.raw"}, cache:"no-store"}); if(!raw.ok) throw {code:"http", status:raw.status}; text = await raw.text(); }
    let parsed; try { parsed = JSON.parse(text || "{}"); } catch { throw {code:"corrupt", message:"desk.json 不是有效的 JSON"}; }
    return {status:200, sha:j.sha, etag:tag, data:norm(parsed)};
  }
  function live(coll){ return Object.entries(data[coll] || {}).filter(([, v]) => v && !v._deleted); }
  function emit(coll, changes, force){ if((changes.length || force) && subs[coll]) subs[coll]({docChanges:() => changes.map(([type, id, d]) => ({type, doc:{id, exists:true, data:() => d}})), metadata:{fromCache:false, hasPendingWrites:false}}); }
  function diffInto(next, skip){
    for(const coll of COLLS){
      const a = data[coll] || {}, b = next[coll] || {}, ch = [];
      for(const id of new Set([...Object.keys(a), ...Object.keys(b)])){
        if(skip && skip.has(coll + "/" + id)) continue;
        const x = a[id], y = b[id]; const xl = x && !x._deleted, yl = y && !y._deleted;
        if(yl && !xl) ch.push(["added", id, y]); else if(!yl && xl) ch.push(["removed", id, x]); else if(yl && xl && JSON.stringify(x) !== JSON.stringify(y)) ch.push(["modified", id, y]);
      }
      emit(coll, ch);
    }
  }
  function prune(d){ const cutoff = Date.now() - 30 * 864e5; const o = {...d}; for(const coll of COLLS){ o[coll] = {}; for(const [id, v] of Object.entries(d[coll] || {})) if(!(v && v._deleted && (v._u || 0) < cutoff)) o[coll][id] = v; } o.updatedAt = new Date().toISOString(); return o; }
  async function put(body, message){
    const r = await fetch(api, {method:"PUT", headers:{...H, "Content-Type":"application/json"}, body:JSON.stringify({message, content:b64enc(body), branch:c.branch, ...(sha ? {sha} : {})})});
    if(r.status === 409 || r.status === 422) return {conflict:true};
    if(r.status === 401 || r.status === 403) throw {code:"auth", status:r.status};
    if(!r.ok) throw {code:"http", status:r.status, message:await r.text().catch(() => "")};
    const j = await r.json(); return {sha:j.content && j.content.sha};
  }
  async function flush(){
    if(flushing) return flushing;
    flushing = (async () => {
      for(let attempt = 0; attempt < 4 && pending.size; attempt++){
        const mine = new Set(pending); pending.clear();
        setStatus("保存中…", "busy");
        try {
          const body = JSON.stringify(prune(data));
          if(body.length > 950000) setStatus("数据接近 1MB 上限，建议清理旧职位", "warn");
          const res = await put(body, `desk: 更新 ${mine.size} 项`);
          if(res.conflict){
            const remote = await getRemote(false);
            const merged = remote.status === 200 ? remote.data : empty();
            for(const key of mine){ const [coll, id] = key.split("/"); merged[coll][id] = data[coll][id]; }
            diffInto(merged, mine); data = merged; sha = remote.sha || null; etag = null;
            mine.forEach(k => pending.add(k)); continue;
          }
          sha = res.sha || sha; etag = null; setStatus(`已同步 ${hhmm()}`, "ok");
        } catch(e){
          mine.forEach(k => pending.add(k));
          setStatus(e && e.code === "auth" ? "GitHub 拒绝写入：检查令牌权限" : "保存失败，稍后自动重试", "err");
          clearTimeout(retryTimer); retryTimer = setTimeout(() => flush(), 30000);
          break;
        }
      }
    })();
    try { await flushing; } finally { flushing = null; }
  }
  function schedule(){ clearTimeout(timer); timer = setTimeout(flush, 1500); setStatus("有未保存的修改", "busy"); }
  async function poll(){
    if(document.hidden || flushing || pending.size) return;
    try {
      const r = await getRemote(true);
      if(r.status === 200 && r.sha !== sha){ diffInto(r.data); data = r.data; sha = r.sha; }
      if(r.etag) etag = r.etag;
      if(r.status !== 304 || !statusText.startsWith("已同步")) setStatus(`已同步 ${hhmm()}`, "ok");
    } catch(e){ setStatus(e && e.code === "auth" ? "GitHub 令牌无效或已过期" : "暂时连不上 GitHub", "err"); }
  }
  const store = {
    async load(){
      const r = await getRemote(false);
      if(r.status === 404){ data = empty(); sha = null; }
      else { data = r.data; sha = r.sha; etag = r.etag; }
      setStatus(`已同步 ${hhmm()}`, "ok");
      setInterval(poll, 45000);
      document.addEventListener("visibilitychange", () => { if(!document.hidden) poll(); else if(pending.size) flush(); });
      window.addEventListener("pagehide", () => { if(pending.size) flush(); });
    },
    collection(coll){ return { onSnapshot(cb){ subs[coll] = cb; setTimeout(() => emit(coll, live(coll).map(([id, v]) => ["added", id, v]), true), 0); return () => { delete subs[coll]; }; } }; },
    doc(path){
      const [coll, id] = path.split("/");
      return {
        async set(v){ const d = JSON.parse(JSON.stringify(v)); if(coll === "jobs" && typeof d.full === "string" && d.full.length > 6000) d.full = d.full.slice(0, 6000);
          d._u = Date.now(); data[coll][id] = d; pending.add(coll + "/" + id); schedule(); },
        async delete(){ data[coll][id] = {_deleted:true, _u:Date.now()}; pending.add(coll + "/" + id); schedule(); },
      };
    },
    flushNow: flush, snapshot: () => JSON.parse(JSON.stringify(data)),
  };
  return store;
}

/* ---------- DeepSeek in place of Claude ---------- */
function blobToDataUrl(b){ return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(b); }); }
function parseLoose(t){
  const s = String(t || "").trim();
  try { return JSON.parse(s); } catch {}
  const f = /```(?:json)?\s*([\s\S]*?)```/.exec(s); if(f){ try { return JSON.parse(f[1]); } catch {} }
  const i = Math.min(...["[","{"].map(ch => { const k = s.indexOf(ch); return k < 0 ? Infinity : k; })), j = Math.max(s.lastIndexOf("]"), s.lastIndexOf("}"));
  if(isFinite(i) && j > i){ try { return JSON.parse(s.slice(i, j + 1)); } catch {} }
  throw {code:"invalid_json", text:s};
}
function makeDeepseek(c){
  const base = (c.dsBase || DEFAULTS.dsBase).replace(/\/+$/, "");
  async function call(messages, tools, signal, onDelta){
    const body = {model:c.dsModel || "deepseek-flash", messages, stream:true, thinking:{type:"disabled"}, max_tokens:8000};
    if(tools && tools.length) body.tools = tools.map(t => ({type:"function", function:{name:t.name, description:t.description, parameters:t.inputSchema || {type:"object", properties:{}}}}));
    let res;
    try { res = await fetch(base + "/chat/completions", {method:"POST", headers:{"Content-Type":"application/json", Authorization:"Bearer " + c.dsKey}, body:JSON.stringify(body), signal}); }
    catch(e){ if(signal && signal.aborted) throw {code:"cancelled"}; throw {code:"network", message:String(e)}; }
    if(!res.ok){ const t = await res.text().catch(() => ""); throw {code: res.status === 401 ? "bad_key" : res.status === 402 ? "no_balance" : res.status === 429 ? "rate_limited" : res.status === 400 ? "bad_request" : "upstream_error", message:t.slice(0, 300)}; }
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = "", content = "", finish = null; const calls = [];
    try {
      for(;;){
        const {done, value} = await reader.read(); if(done) break;
        buf += dec.decode(value, {stream:true}); let k;
        while((k = buf.indexOf("\n")) >= 0){
          const line = buf.slice(0, k).trim(); buf = buf.slice(k + 1);
          if(!line.startsWith("data:")) continue; const payload = line.slice(5).trim(); if(payload === "[DONE]") continue;
          let j; try { j = JSON.parse(payload); } catch { continue; }
          const ch = j.choices && j.choices[0]; if(!ch) continue; const d = ch.delta || {};
          if(d.content){ content += d.content; onDelta && onDelta(content); }
          if(d.tool_calls) for(const tc of d.tool_calls){ const n = tc.index ?? 0; calls[n] ||= {id:"", name:"", args:""}; if(tc.id) calls[n].id = tc.id; if(tc.function && tc.function.name) calls[n].name += tc.function.name; if(tc.function && tc.function.arguments) calls[n].args += tc.function.arguments; }
          if(ch.finish_reason) finish = ch.finish_reason;
        }
      }
    } catch(e){ if(signal && signal.aborted) throw {code:"cancelled", text:content}; throw {code:"network", message:String(e), text:content}; }
    return {content, calls:calls.filter(Boolean), finish};
  }
  async function run(input, opts = {}){
    let turns = typeof input === "string" ? [{role:"user", content:input}] : input.map(t => ({role:t.role, content:t.content}));
    const msgs = [];
    // In a conversation the page puts its standing instructions in the first turn: send them as the system message.
    if(turns.length > 1 && turns[0].role === "user"){ msgs.push({role:"system", content:turns[0].content}); turns = turns.slice(1); }
    for(const t of turns){ const last = msgs[msgs.length - 1]; if(last && last.role === t.role && last.role !== "system") last.content += "\n\n" + t.content; else msgs.push({...t}); }
    if(opts.images && opts.images.length){ const urls = await Promise.all([...opts.images].slice(0, 4).map(blobToDataUrl)); const last = msgs[msgs.length - 1]; last.content = [{type:"text", text:last.content}, ...urls.map(u => ({type:"image_url", image_url:{url:u}}))]; }
    const tools = opts.tools || []; let prefix = "";
    for(let round = 0; round < 6; round++){
      const r = await call(msgs, round < 5 ? tools : [], opts.signal, t => opts.onText && opts.onText({text:prefix + t, delta:""}));
      if(r.calls.length && tools.length){
        msgs.push({role:"assistant", content:r.content || "", tool_calls:r.calls.map(x => ({id:x.id, type:"function", function:{name:x.name, arguments:x.args || "{}"}}))});
        if(r.content) prefix += r.content + "\n\n";
        for(const x of r.calls){
          const t = tools.find(y => y.name === x.name); let out;
          try { out = t ? await t.execute(x.args ? JSON.parse(x.args) : {}, {signal:opts.signal}) : "没有这个工具"; } catch(e){ out = "Error: " + (e && e.message || e); }
          msgs.push({role:"tool", tool_call_id:x.id, content:(typeof out === "string" ? out : JSON.stringify(out)).slice(0, 32000)});
        }
        continue;
      }
      const text = prefix + (r.content || "");
      if(!text.trim()) throw {code:"empty_completion"};
      opts.onText && opts.onText({text, delta:""});
      return {text, truncated:r.finish === "length", modelTierApplied:"default"};
    }
    throw {code:"upstream_error", message:"工具调用轮数过多"};
  }
  run.json = async (input, opts = {}) => { const r = await run(input, {...opts, tools:undefined}); return parseLoose(r.text); };
  run.limits = async () => ({maxPromptBytes:262144, tools:{maxCount:20}, images:{maxCount:4, maxInputBytes:2e7, mediaTypes:["image/jpeg","image/png","image/webp","image/gif"]}});
  return run;
}

/* ---------- File download (plain browser, not sandboxed) ---------- */
const downloads = { async save({filename, data}){ const blob = data instanceof Blob ? data : new Blob([data], {type:"application/json"}); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); return {}; } };

/* ---------- The window.claude shim the app talks to ---------- */
let storePromise = null;
function getStore(){
  if(!cfg.token || !cfg.owner || !cfg.repo) return Promise.resolve(null);
  return storePromise ||= (async () => { const s = makeStore(cfg); try { await s.load(); return s; } catch(e){ window.__loadError = e; setStatus(e && e.code === "auth" ? "GitHub 令牌无效" : "连不上 GitHub", "err"); return null; } })();
}
window.claude = { use: async name => {
  if(name === "db") return getStore();
  if(name === "sample") return cfg.dsKey ? makeDeepseek(cfg) : null;
  if(name === "downloads") return downloads;
  return null;
} };

/* ---------- Connection settings (first run and from the Settings tab) ---------- */
async function testGitHub(c){
  const r = await fetch(`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}`, {headers:{Authorization:"Bearer " + c.token, Accept:"application/vnd.github+json"}, cache:"no-store"});
  if(r.status === 404) return "找不到这个仓库，或者令牌没有访问它的权限。";
  if(r.status === 401) return "令牌无效或已过期。";
  if(!r.ok) return `GitHub 返回 ${r.status}。`;
  const j = await r.json();
  if(!j.private) return "warn:这个仓库是公开的，数据会被任何人看到。建议改成私有仓库。";
  if(j.permissions && j.permissions.push === false) return "令牌只有读取权限，需要 Contents 的读写权限。";
  return "";
}
async function testDeepseek(c){
  try { const r = await fetch((c.dsBase || DEFAULTS.dsBase).replace(/\/+$/, "") + "/chat/completions", {method:"POST", headers:{"Content-Type":"application/json", Authorization:"Bearer " + c.dsKey}, body:JSON.stringify({model:c.dsModel, messages:[{role:"user", content:"回复 OK"}], max_tokens:5, thinking:{type:"disabled"}})});
    if(r.status === 401) return "DeepSeek 密钥无效。"; if(r.status === 402) return "DeepSeek 账户余额不足。"; if(!r.ok) return `DeepSeek 返回 ${r.status}。`; return ""; }
  catch(e){ return "浏览器无法直接连接 DeepSeek（可能是跨域限制）。可以在“接口地址”填一个转发服务的地址，见仓库里的 proxy/README。"; }
}
window.__showSetup = function(fromPrefs){
  const main = document.getElementById("main"); if(!main) return;
  const err = window.__loadError;
  main.innerHTML = `
    <div class="view-head"><div><h1>${fromPrefs ? "连接设置" : "连接你的数据"}</h1><p>这些信息只保存在这台设备的浏览器里，不会上传到任何地方。每台设备设置一次。</p></div></div>
    ${err && !fromPrefs ? `<div class="panel callout" style="border-left-color:var(--urgent)"><div><strong>上次连接失败</strong><span>${esc(err.code === "auth" ? "GitHub 令牌无效、过期，或没有这个仓库的权限。" : err.code === "corrupt" ? "数据文件损坏：" + (err.message || "") : "连不上 GitHub，检查网络后重试。")}</span></div></div>` : ""}
    <form class="panel pad setup" id="gh-setup">
      <h2 class="ph">GitHub 私有数据仓库</h2>
      <div class="f2">
        <label class="field"><span>GitHub 用户名</span><input type="text" name="owner" value="${esc(cfg.owner)}" required></label>
        <label class="field"><span>私有仓库名</span><input type="text" name="repo" value="${esc(cfg.repo)}" required></label>
        <label class="field"><span>分支</span><input type="text" name="branch" value="${esc(cfg.branch)}" required></label>
        <label class="field"><span>数据文件</span><input type="text" name="path" value="${esc(cfg.path)}" required></label>
      </div>
      <label class="field"><span>GitHub 令牌（fine-grained token，只授权这个仓库的 Contents 读写）</span><input type="password" name="token" value="${esc(cfg.token)}" autocomplete="off" required placeholder="github_pat_…"></label>
      <h2 class="ph" style="margin-top:14px">DeepSeek（可选：识别招聘信息和 AI 助手）</h2>
      <label class="field"><span>DeepSeek API 密钥</span><input type="password" name="dsKey" value="${esc(cfg.dsKey)}" autocomplete="off" placeholder="sk-…"></label>
      <div class="f2">
        <label class="field"><span>接口地址</span><input type="url" name="dsBase" value="${esc(cfg.dsBase)}"></label>
        <label class="field"><span>模型</span><select name="dsModel">${["deepseek-flash","deepseek-v4-pro"].map(m => `<option${cfg.dsModel === m ? " selected" : ""}>${m}</option>`).join("")}</select></label>
      </div>
      <p class="hint" id="gh-msg" style="margin:0"></p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
        ${fromPrefs ? `<button class="btn ghost danger" type="button" id="gh-forget">清除这台设备上保存的令牌和密钥</button><button class="btn" type="button" id="gh-cancel">返回</button>` : ""}
        <button class="btn primary" type="submit" id="gh-save">测试并保存</button>
      </div>
    </form>`;
  const form = document.getElementById("gh-setup"), msg = document.getElementById("gh-msg");
  form.addEventListener("submit", async e => {
    e.preventDefault(); const fd = Object.fromEntries(new FormData(form)); const next = {...cfg, ...Object.fromEntries(Object.entries(fd).map(([k, v]) => [k, String(v).trim()]))};
    const btn = document.getElementById("gh-save"); btn.disabled = true; msg.textContent = "正在测试 GitHub…";
    let w = ""; try { w = await testGitHub(next); } catch { w = "连不上 GitHub，检查网络后重试。"; }
    if(w && !w.startsWith("warn:")){ msg.textContent = w; btn.disabled = false; return; }
    let note = w ? w.slice(5) + " " : "";
    if(next.dsKey){ msg.textContent = "正在测试 DeepSeek…"; const d = await testDeepseek(next); if(d) note += d + "（GitHub 已连接，DeepSeek 可以稍后再改。）"; }
    saveCfg(next); msg.textContent = (note || "连接成功。") + "正在载入…"; setTimeout(() => location.reload(), note ? 2500 : 600);
  });
  const forget = document.getElementById("gh-forget"); if(forget) forget.addEventListener("click", () => { saveCfg({...cfg, token:"", dsKey:""}); location.reload(); });
  const cancel = document.getElementById("gh-cancel"); if(cancel) cancel.addEventListener("click", () => { location.hash = "prefs"; location.reload(); });
};
window.__ghPanel = function(){
  return `<section class="panel pad"><h2 class="ph">连接</h2>
    <p class="hint" style="margin:0 0 10px">数据保存在 GitHub 私有仓库 <b>${esc(cfg.owner)}/${esc(cfg.repo)}</b> 的 ${esc(cfg.path)}；AI 功能使用 DeepSeek（${cfg.dsKey ? esc(cfg.dsModel) : "未设置密钥"}）。同步状态：${esc(statusText || "—")}</p>
    <button class="btn" type="button" onclick="window.__showSetup(true)">修改连接设置</button></section>`;
};
document.addEventListener("DOMContentLoaded", () => setStatus(statusText, statusKind));
})();

</script>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: sticky top bar with view tabs; one working pane per view; a job opens in a right-hand drawer (a full-screen sheet on phones). */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --raised:#F8F9FB; --ink:#15202B; --muted:#5A6676; --faint:#8A94A2; --line:#DCE1E7; --hover:#ECEFF3;
  --accent:#0E6B63; --accent-ink:#FFFFFF; --accent-soft:#DFF0ED;
  --urgent:#B5381A; --urgent-soft:#FBE7E1; --soon:#946008; --soon-soft:#FAEFD6; --ok:#1E7640; --ok-soft:#E1F2E6;
  --s-inbox:#C2387A; --s-watch:#8A94A2; --s-prep:#C98A12; --s-sent:#3A6BD1; --s-interview:#0E8C80; --s-flyout:#7A4CC2; --s-offer:#1E7640; --s-rejected:#B9BFC8; --s-skip:#D3D7DD;
  --shadow:0 12px 40px rgba(21,32,43,.16);
  --font:"Schibsted Grotesk",system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161C; --surface:#182029; --raised:#1D2630; --ink:#E6EBF0; --muted:#A1ACB9; --faint:#76818F; --line:#2B3541; --hover:#222C37;
    --accent:#5FC2B5; --accent-ink:#0B1A18; --accent-soft:#17312E;
    --urgent:#F08A6C; --urgent-soft:#3A1F18; --soon:#E3B45A; --soon-soft:#332812; --ok:#6CCB8C; --ok-soft:#16301F;
    --s-inbox:#E585B2; --s-watch:#76818F; --s-prep:#E3B45A; --s-sent:#7FA3F0; --s-interview:#5FC2B5; --s-flyout:#B395EA; --s-offer:#6CCB8C; --s-rejected:#4A5562; --s-skip:#3A444F;
    --shadow:0 12px 40px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161C; --surface:#182029; --raised:#1D2630; --ink:#E6EBF0; --muted:#A1ACB9; --faint:#76818F; --line:#2B3541; --hover:#222C37;
  --accent:#5FC2B5; --accent-ink:#0B1A18; --accent-soft:#17312E;
  --urgent:#F08A6C; --urgent-soft:#3A1F18; --soon:#E3B45A; --soon-soft:#332812; --ok:#6CCB8C; --ok-soft:#16301F;
  --s-inbox:#E585B2; --s-watch:#76818F; --s-prep:#E3B45A; --s-sent:#7FA3F0; --s-interview:#5FC2B5; --s-flyout:#B395EA; --s-offer:#6CCB8C; --s-rejected:#4A5562; --s-skip:#3A444F;
  --shadow:0 12px 40px rgba(0,0,0,.5);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg); color:var(--ink); font:400 14px/1.5 var(--font); font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit; color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
h1,h2,h3{margin:0; text-wrap:balance}

.gutter{padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1180px; margin:0 auto}

/* Top bar */
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--surface)}
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:9; background:var(--surface); border-bottom:1px solid var(--line)}
.top .inner{display:flex; align-items:center; gap:24px; min-height:56px; flex-wrap:wrap}
.brand{font-weight:700; font-size:16px; letter-spacing:-.01em; white-space:nowrap}
.brand small{font-weight:400; color:var(--muted); font-size:13px; margin-left:8px}
.tabs{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; flex:1; min-width:0}
.tabs a{padding:17px 12px 15px; color:var(--muted); text-decoration:none; font-weight:500; white-space:nowrap; border-bottom:2px solid transparent}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink); border-bottom-color:var(--accent)}
.top-actions{display:flex; gap:8px}

main.inner{padding-block:24px 112px}
.view-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:18px}
.view-head h1{font-size:22px; font-weight:650; letter-spacing:-.015em}
.view-head p{margin:4px 0 0; color:var(--muted)}

/* Buttons & fields */
.btn{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--surface); padding:7px 12px; border-radius:var(--r); cursor:pointer; font-weight:500; white-space:nowrap; text-decoration:none; color:var(--ink)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent; background:transparent}
.btn.danger{color:var(--urgent)}
.btn.danger[data-armed]{background:var(--urgent); color:var(--surface); border-color:var(--urgent)}
.btn:disabled{opacity:.5; cursor:default}
.field{display:flex; flex-direction:column; gap:4px; min-width:0}
.field > span{font-size:12px; color:var(--muted); font-weight:500}
input[type=text],input[type=url],input[type=search],input[type=date],input[type=time],select,textarea{
  width:100%; border:1px solid var(--line); background:var(--surface); border-radius:var(--r); padding:7px 9px; min-width:0}
textarea{resize:vertical; line-height:1.55}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:transparent}

/* Panels */
.panel{background:var(--surface); border:1px solid var(--line); border-radius:8px}
.panel-head{display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:14px 16px 10px}
.panel-head h2{font-size:15px; font-weight:650}
.panel-head .count{color:var(--muted); font-size:13px}
.empty{padding:28px 16px; color:var(--muted); text-align:center}
.empty strong{display:block; color:var(--ink); font-weight:600; margin-bottom:4px}
.empty .btn{margin-top:12px}

/* Pipeline */
.pipeline{padding:18px 18px 16px; margin-bottom:16px}
.pipe-top{display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:12px}
.pipe-top h2{font-size:15px; font-weight:650}
.pipe-top span{color:var(--muted)}
.pipe-bar{display:flex; height:12px; border-radius:6px; overflow:hidden; background:var(--hover); gap:2px}
.pipe-bar i{display:block; height:100%}
.pipe-legend{display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:12px; margin-top:14px}
.pipe-legend button{all:unset; cursor:pointer; display:flex; flex-direction:column; gap:2px; padding:6px 8px; border-radius:var(--r)}
.pipe-legend button:hover{background:var(--hover)}
.pipe-legend button:focus-visible{outline:2px solid var(--accent)}
.pipe-legend b{font-size:22px; font-weight:650; letter-spacing:-.02em}
.pipe-legend span{display:flex; align-items:center; gap:6px; color:var(--muted); font-size:13px}
.dot{width:8px; height:8px; border-radius:50%; flex:none; display:inline-block}

.grid2{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:16px}

/* Rows */
.rows{list-style:none; margin:0; padding:0 0 6px}
.row{display:grid; grid-template-columns:76px minmax(0,1fr) auto; gap:12px; align-items:center; padding:9px 16px; border-top:1px solid var(--line); cursor:pointer}
.row:hover{background:var(--hover)}
.row .main{min-width:0}
.row .t1{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.row .t2{color:var(--muted); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.row .side{display:flex; align-items:center; gap:8px; color:var(--muted); font-size:13px}

/* Countdown: the signature element */
.tminus{display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:var(--r); padding:4px 0; line-height:1.1; background:var(--hover); color:var(--muted); min-height:42px}
.tminus b{font-size:18px; font-weight:700; letter-spacing:-.02em; color:var(--ink)}
.tminus small{font-size:11px}
.tminus.urgent{background:var(--urgent-soft); color:var(--urgent)} .tminus.urgent b{color:var(--urgent)}
.tminus.soon{background:var(--soon-soft); color:var(--soon)} .tminus.soon b{color:var(--soon)}
.tminus.past{background:transparent; color:var(--faint)} .tminus.past b{color:var(--faint); font-size:14px}
.tminus.none b{font-size:14px; color:var(--faint)}

.pill{display:inline-flex; align-items:center; gap:6px; padding:2px 9px 2px 7px; border-radius:999px; background:var(--hover); font-size:12.5px; font-weight:500; white-space:nowrap; color:var(--ink)}
.meter{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted); white-space:nowrap}
.meter i{display:block; width:42px; height:5px; border-radius:3px; background:var(--hover); position:relative; overflow:hidden}
.meter i::after{content:""; position:absolute; inset:0 auto 0 0; width:var(--p); background:var(--accent)}
.meter.full{color:var(--ok)} .meter.full i::after{background:var(--ok)}
.stars{color:var(--soon); letter-spacing:1px; font-size:12px}

/* Jobs table */
.toolbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px}
.toolbar input[type=search]{max-width:280px}
.toolbar select{width:auto}
.jobs-table{width:100%; border-collapse:collapse}
.jobs-table th{text-align:left; font-size:12px; font-weight:500; color:var(--muted); padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap}
.jobs-table td{padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:middle}
.jobs-table tbody tr{cursor:pointer}
.jobs-table tbody tr:hover{background:var(--hover)}
.jobs-table tbody tr:last-child td{border-bottom:0}
.jobs-table .inst{font-weight:600}
.jobs-table .sub{color:var(--muted); font-size:13px}
.jobs-table .tm{width:84px}
.jobs-table .tminus{width:68px}
.cell-clip{max-width:340px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* Agenda */
.agenda-day{display:grid; grid-template-columns:120px minmax(0,1fr); gap:16px; padding:14px 16px; border-top:1px solid var(--line)}
.agenda-day:first-child{border-top:0}
.agenda-date b{display:block; font-size:15px; font-weight:650}
.agenda-date span{color:var(--muted); font-size:13px}
.agenda-date.today b{color:var(--accent)}
.agenda-items{display:flex; flex-direction:column; gap:8px}
.ev{display:grid; grid-template-columns:4px minmax(0,1fr) auto; gap:12px; align-items:start; padding:9px 12px 9px 0; border-radius:var(--r); background:var(--raised); cursor:pointer}
.ev:hover{background:var(--hover)}
.ev .bar{align-self:stretch; border-radius:0 3px 3px 0}
.ev .t1{font-weight:600}
.ev .t2{color:var(--muted); font-size:13px}
.ev .when{text-align:right; font-size:13px; white-space:nowrap}
.ev .when b{display:block; font-size:14px}
.ev .when span{color:var(--muted)}

/* Materials */
.kind-group{padding:4px 0 8px}
.kind-group + .kind-group{border-top:1px solid var(--line)}
.kind-group h3{font-size:13px; font-weight:600; color:var(--muted); padding:12px 16px 4px}
.mat{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; padding:9px 16px; cursor:pointer; align-items:center}
.mat:hover{background:var(--hover)}
.mat .t1{font-weight:600}
.mat .t2{color:var(--muted); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* Prep */
.cats{display:flex; gap:6px; flex-wrap:wrap}
.chip{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:4px 11px; cursor:pointer; font-size:13px; font-weight:500}
.chip:hover{background:var(--hover)}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.qa{border-top:1px solid var(--line)}
.qa:first-child{border-top:0}
.qa summary{list-style:none; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; padding:12px 16px; cursor:pointer; align-items:center}
.qa summary::-webkit-details-marker{display:none}
.qa summary:hover{background:var(--hover)}
.qa .q{font-weight:600}
.qa .q small{display:block; font-weight:400; color:var(--muted); font-size:12.5px; margin-top:2px}
.qa .body{padding:0 16px 16px; display:flex; flex-direction:column; gap:10px}
.lvl{display:inline-flex; border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.lvl button{border:0; background:transparent; padding:4px 10px; cursor:pointer; font-size:12.5px; color:var(--muted)}
.lvl button + button{border-left:1px solid var(--line)}
.lvl button[aria-pressed="true"]{background:var(--accent-soft); color:var(--accent); font-weight:600}
.lvl-tag{font-size:12px; padding:2px 8px; border-radius:999px; white-space:nowrap}
.lvl-0{background:var(--hover); color:var(--muted)} .lvl-1{background:var(--soon-soft); color:var(--soon)} .lvl-2{background:var(--ok-soft); color:var(--ok)}

/* Drawer */
.scrim{position:fixed; inset:0; background:rgba(10,16,22,.38); z-index:20}
.drawer{position:fixed; top:0; right:0; bottom:0; width:min(560px,100%); background:var(--surface); z-index:21; box-shadow:var(--shadow); display:flex; flex-direction:column;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); padding-right:env(safe-area-inset-right,0px)}
.drawer-head{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:12px 16px; border-bottom:1px solid var(--line)}
.drawer-head .crumb{color:var(--muted); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.drawer-body{overflow-y:auto; padding:18px 20px 32px; display:flex; flex-direction:column; gap:20px}
.big-input{font-size:20px !important; font-weight:650; letter-spacing:-.01em; border-color:transparent !important; padding:4px 6px !important; margin-left:-6px; width:calc(100% + 6px) !important}
.big-input:hover{border-color:var(--line) !important}
.sub-input{border-color:transparent !important; padding:3px 6px !important; margin-left:-6px; width:calc(100% + 6px) !important; color:var(--muted)}
.sub-input:hover{border-color:var(--line) !important}
.fgrid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px}
.fgrid .wide{grid-column:span 2}
.sec-title{font-size:13px; font-weight:600; color:var(--muted); margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; gap:8px}
.mchips{display:flex; flex-wrap:wrap; gap:6px}
.mchip{border:1px dashed var(--line); background:transparent; color:var(--faint); padding:5px 10px; border-radius:var(--r); cursor:pointer; font-size:13px}
.mchip[data-s="1"]{border-style:solid; border-color:var(--line); color:var(--ink); background:var(--surface)}
.mchip[data-s="2"]{border-style:solid; border-color:var(--ok); background:var(--ok-soft); color:var(--ok); font-weight:600}
.mchip[data-s="2"]::before{content:"✓ "}
.hint{color:var(--faint); font-size:12.5px; margin:6px 0 0}
.minilist{display:flex; flex-direction:column; gap:6px}
.miniitem{display:flex; justify-content:space-between; gap:12px; padding:8px 10px; background:var(--raised); border-radius:var(--r); cursor:pointer}
.miniitem:hover{background:var(--hover)}
.miniitem span{color:var(--muted); font-size:13px; white-space:nowrap}
.fulltext{white-space:pre-wrap; font-size:13px; color:var(--muted); max-height:340px; overflow:auto; background:var(--raised); padding:12px; border-radius:var(--r); margin-top:8px}
.metaline{display:flex; flex-wrap:wrap; gap:6px 16px; color:var(--muted); font-size:12.5px}
details > summary{cursor:pointer}

/* Dialog */
dialog{border:0; border-radius:10px; padding:0; width:min(640px,calc(100% - 24px)); max-height:calc(100% - 32px); background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}
dialog.wide{width:min(920px,calc(100% - 24px))}
dialog::backdrop{background:rgba(10,16,22,.42)}
.dlg{display:flex; flex-direction:column; max-height:calc(100vh - 32px)}
.dlg-head{display:flex; justify-content:space-between; align-items:center; padding:14px 18px; border-bottom:1px solid var(--line)}
.dlg-head h2{font-size:16px; font-weight:650}
.dlg-body{padding:16px 18px; overflow-y:auto; display:flex; flex-direction:column; gap:14px}
.dlg-foot{display:flex; justify-content:space-between; gap:8px; padding:12px 18px; border-top:1px solid var(--line); flex-wrap:wrap}
.dlg-foot .r{display:flex; gap:8px; margin-left:auto}
.f2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
.f3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px}

.drop{border:1.5px dashed var(--line); border-radius:8px; padding:26px 16px; text-align:center; color:var(--muted)}
.drop.over{border-color:var(--accent); background:var(--accent-soft)}
.drop label{color:var(--accent); font-weight:600; cursor:pointer; text-decoration:underline}
.steps{margin:0; padding-left:20px; color:var(--muted)}
.steps li{margin:2px 0}
.imp-list{border:1px solid var(--line); border-radius:8px; max-height:46vh; overflow:auto}
.imp-row{display:grid; grid-template-columns:22px minmax(0,1fr) 120px; gap:10px; align-items:start; padding:8px 12px; border-top:1px solid var(--line); cursor:pointer}
.imp-row:first-child{border-top:0}
.imp-row:hover{background:var(--hover)}
.imp-row input{margin-top:3px}
.imp-row .t1{font-weight:600}
.imp-row .t2{font-size:12.5px; color:var(--muted)}
.imp-row .d{font-size:13px; text-align:right; color:var(--muted)}
.badge{font-size:11.5px; padding:1px 7px; border-radius:999px; background:var(--accent-soft); color:var(--accent); margin-left:6px; font-weight:500}
.picklist{border:1px solid var(--line); border-radius:var(--r); max-height:180px; overflow:auto; padding:4px}
.picklist label{display:flex; gap:8px; align-items:center; padding:4px 6px; border-radius:4px; cursor:pointer}
.picklist label:hover{background:var(--hover)}
.progress{height:6px; background:var(--hover); border-radius:3px; overflow:hidden}
.progress i{display:block; height:100%; background:var(--accent); width:0}

.callout{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 16px; margin-bottom:16px; border-left:4px solid var(--s-inbox); flex-wrap:wrap}
.callout strong{display:block; font-weight:650}
.callout span{color:var(--muted); font-size:13px}
.btn.sm{padding:3px 9px; font-size:12.5px}
.triage{display:inline-flex; gap:4px}
.pcard{border:1px solid var(--line); border-radius:8px; padding:12px; display:flex; flex-direction:column; gap:10px}
.pcard-head{display:flex; gap:10px; align-items:center}
.pcard-head label{font-weight:600}
.thumbs{display:flex; gap:8px; flex-wrap:wrap}
.thumbs figure{margin:0; position:relative; width:84px; height:84px; border-radius:6px; overflow:hidden; border:1px solid var(--line)}
.thumbs img{width:100%; height:100%; object-fit:cover}
.thumbs button{position:absolute; top:2px; right:2px; border:0; border-radius:4px; background:var(--ink); color:var(--surface); font-size:11px; padding:1px 5px; cursor:pointer}
.sheet-row{display:grid; grid-template-columns:22px minmax(0,1fr) 150px 240px; gap:10px; align-items:center; padding:9px 12px; border-top:1px solid var(--line)}
.sheet-row:first-child{border-top:0}
.sheet-row.check{box-shadow:inset 3px 0 0 var(--soon)}
.sheet-row .t1{font-weight:600}
.sheet-row .t2{font-size:12.5px; color:var(--muted)}
@media (max-width:760px){ .sheet-row{grid-template-columns:22px minmax(0,1fr)} .sheet-row input[type=date], .sheet-row select{grid-column:2} }
.prefs-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; align-items:start}
.panel.pad{padding:16px 18px}
.ph{font-size:15px; font-weight:650; margin-bottom:6px}
.ph3{font-size:13px; font-weight:600; color:var(--muted); margin:16px 0 8px}
.pref-fields{display:flex; flex-direction:column; gap:10px}
.runlog{background:var(--raised); border-radius:var(--r); padding:10px 12px; display:flex; flex-direction:column; gap:2px}
.ed-list{display:flex; flex-direction:column; gap:6px}
.ed-row{display:flex; gap:6px; align-items:center}
.ed-row input[type=text]{flex:1}
.ed-def{display:inline-flex; gap:4px; align-items:center; font-size:12.5px; color:var(--muted); white-space:nowrap}
.ed-add{display:flex; gap:6px; margin-top:4px}
.ed-add input{flex:1}
.tagchip{border:1px solid var(--line); background:transparent; border-radius:999px; padding:4px 11px; cursor:pointer; font-size:13px; color:var(--muted)}
.tagchip[aria-pressed="true"]{background:var(--accent-soft); color:var(--accent); border-color:var(--accent); font-weight:600}
.tagmini{display:inline-block; font-size:11.5px; padding:0 7px; border-radius:999px; background:var(--accent-soft); color:var(--accent); margin-left:6px; font-weight:500; vertical-align:1px}
.newmini{display:inline-block; font-size:11px; padding:0 6px; border-radius:999px; background:var(--s-inbox); color:var(--surface); margin-left:6px; font-weight:600; vertical-align:1px}
@media (max-width:860px){ .prefs-grid{grid-template-columns:1fr} .ed-row{flex-wrap:wrap} }
.seg{display:inline-flex; border:1px solid var(--line); border-radius:var(--r); overflow:hidden; background:var(--surface)}
.seg button{border:0; background:transparent; padding:7px 12px; cursor:pointer; color:var(--muted); font-weight:500}

.seg button[aria-pressed="true"]{background:var(--ink); color:var(--surface)}

<script>
(() => {
"use strict";

/* ---------- Constants ---------- */
const STATUSES = [
  {k:"inbox",     l:"待筛选",    d:"检索或识别到的新职位，还没看过"},
  {k:"watch",     l:"待定",      d:"感兴趣，还没决定是否申请"},
  {k:"prep",      l:"准备中",    d:"决定申请，正在准备材料"},
  {k:"sent",      l:"已提交",    d:"材料已提交，等待回复"},
  {k:"interview", l:"初面",      d:"拿到初面（视频或年会）"},
  {k:"flyout",    l:"校园面试",  d:"受邀到校：学术报告、试讲、面谈"},
  {k:"offer",     l:"Offer",     d:"拿到 offer，谈条件或已签约"},
  {k:"rejected",  l:"已拒",      d:"被拒或职位取消"},
  {k:"skip",      l:"不申请",    d:"决定放弃"},
];
const ST = Object.fromEntries(STATUSES.map(s => [s.k, s]));
const CLOSED = new Set(["rejected","skip"]);
const EARLY = new Set(["inbox","watch","prep"]);
/* Defaults; the user's own lists live in meta/settings and replace these at load */
const DEFAULT_MATS = [
  {k:"cv",l:"英文 CV",def:true},{k:"cvzh",l:"中文简历"},{k:"jmp",l:"JMP / 代表作",def:true},{k:"research",l:"研究计划",def:true},
  {k:"teaching",l:"教学陈述"},{k:"letters",l:"推荐信",def:true},{k:"cover",l:"求职信"},{k:"degree",l:"学位证明 / 成绩单",def:true},
  {k:"form",l:"学校申请表"},{k:"idcard",l:"身份证件"},{k:"awards",l:"获奖 / 项目证明"},
];
const DEFAULT_QA_CATS = ["学术报告","研究规划","教学与试讲","动机与匹配","考核与待遇","通用"];
const DEFAULT_TAGS = ["重点","冲刺","稳妥","需先联系"];
let MATS = DEFAULT_MATS, MAT_KEYS = [], DEFAULT_REQ = {}, QA_CATS = DEFAULT_QA_CATS, TAGS = DEFAULT_TAGS;
function applySettings(){
  const st = (S.meta && S.meta.get("settings")) || {};
  MATS = Array.isArray(st.materials) && st.materials.length ? st.materials : DEFAULT_MATS;
  MAT_KEYS = MATS.map(m => m.k);
  DEFAULT_REQ = Object.fromEntries(MATS.filter(m => m.def).map(m => [m.k, 1]));
  QA_CATS = Array.isArray(st.qaCats) && st.qaCats.length ? st.qaCats : DEFAULT_QA_CATS;
  TAGS = Array.isArray(st.tags) ? st.tags : DEFAULT_TAGS;
}
const PORTALS = ["","邮件投递","学校招聘系统","学院官网报名","EconJobMarket","AEA JOE","Interfolio","AcademicJobsOnline","其他"];
const JOB_TYPES = ["","助理教授（预聘/长聘轨）","讲师","副研究员/研究员","师资博士后","博士后","副教授及以上","多个职级","其他"];
const SOURCES = ["","学校官网","微信公众号","人才网","EJM","JOE","他人推荐","其他"];
const EV_TYPES = [
  {k:"interview",l:"初面",c:"var(--s-interview)"},
  {k:"flyout",l:"校园面试",c:"var(--s-flyout)"},
  {k:"talk",l:"学术报告",c:"var(--s-sent)"},
  {k:"demo",l:"试讲",c:"var(--s-prep)"},
  {k:"deadline",l:"Offer 答复截止",c:"var(--urgent)"},
  {k:"other",l:"其他",c:"var(--s-watch)"},
];
const EVT = Object.fromEntries(EV_TYPES.map(t => [t.k, t]));
const FORMATS = ["","视频面试（腾讯会议 / Zoom）","年会现场","到校","电话","其他"];
const TZS = [
  ["Asia/Shanghai","北京"],["America/New_York","美东"],["America/Chicago","美中"],["America/Los_Angeles","美西"],
  ["Europe/London","英国"],["Europe/Paris","欧洲中部"],["Asia/Singapore","新加坡"],["Australia/Sydney","悉尼"],
];
const TZL = Object.fromEntries(TZS);
const MAT_KINDS = ["英文 CV","中文简历","JMP / 代表作","研究计划","教学陈述","求职信","其他"];
/* Target region: mainland China plus Macao (Hong Kong, Taiwan and elsewhere are out) */
const REGION_OUT = /hong\s*kong|taiwan|taipei|香港|台湾/i;
function isMainland(x){ const loc = String(x.loc || ""); const t = [loc, x.inst].join(" ");
  if(/maca[uo]|澳门/i.test(t)) return true;
  if(loc && /shenzhen|guangzhou|zhuhai|深圳|广州|珠海/i.test(loc)) return true;
  return /china|中国|p\.?\s?r\.?\s?c/i.test(t) && !REGION_OUT.test(t); }
const LOCAL_TZ = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Shanghai"; } catch { return "Asia/Shanghai"; } })();

/* ---------- State ---------- */
const S = { db:null, jobs:new Map(), events:new Map(), mats:new Map(), qa:new Map(), meta:new Map(),
  loaded:{jobs:false,events:false,mats:false,qa:false,meta:false}, view:"overview",
  jobFilter:{q:"", status:"active", sort:"deadline", tag:"", onlyNew:false}, calPast:false, calDeadlines:true,
  qaCat:"全部", drawerJob:null, downloads:null, denied:false, sel:new Set(),
  jobView: lsGet("jd-jobview") || "list", calMode: lsGet("jd-calmode") || "month", calMonth:"", calDay:"" };
function lsGet(k){ try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch {} }
applySettings();

/* ---------- Utils ---------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr = () => ymd(new Date());
const nowIso = () => new Date().toISOString();
function parseYmd(s){ const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s||""); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; }
function daysUntil(s){ const d = parseYmd(s); if(!d) return null; const t = parseYmd(todayStr()); return Math.round((d - t) / 864e5); }
const WD = ["周日","周一","周二","周三","周四","周五","周六"];
function fmtDate(s, withWd=true){ const d = parseYmd(s); if(!d) return ""; const thisYear = d.getFullYear() === new Date().getFullYear();
  return `${thisYear ? "" : d.getFullYear()+"年"}${d.getMonth()+1}月${d.getDate()}日${withWd ? " "+WD[d.getDay()] : ""}`; }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 3200); }
function linkify(t){ return esc(t).replace(/https?:\/\/[^\s<，,；;）)]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u.length > 70 ? u.slice(0, 67) + "…" : u}</a>`); }
function host(u){ try { return new URL(u).hostname.replace(/^www\./,""); } catch { return ""; } }

/* Time zones */
function tzOffset(tz, ms){
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US",{timeZone:tz,hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"})
    .formatToParts(new Date(ms)).map(x => [x.type, x.value]));
  return Date.UTC(+p.year, +p.month-1, +p.day, +p.hour % 24, +p.minute, +p.second) - ms;
}
function zonedToUtc(date, time, tz){
  const [y,m,d] = date.split("-").map(Number); const [hh,mm] = (time||"00:00").split(":").map(Number);
  const guess = Date.UTC(y, m-1, d, hh, mm);
  try { const o1 = tzOffset(tz, guess); let t = guess - o1; const o2 = tzOffset(tz, t); if(o2 !== o1) t = guess - o2; return t; }
  catch { return new Date(y, m-1, d, hh, mm).getTime(); }
}
function partsIn(ms, tz){
  const f = new Intl.DateTimeFormat("en-CA",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"});
  const p = Object.fromEntries(f.formatToParts(new Date(ms)).map(x => [x.type, x.value]));
  return {date:`${p.year}-${p.month}-${p.day}`, time:`${p.hour}:${p.minute}`};
}
/* An event's position in the viewer's own time zone */
function evLocal(ev){
  if(!ev.date) return {date:"", time:"", ms:Infinity};
  if(!ev.time) return {date:ev.date, time:"", ms:parseYmd(ev.date).getTime()};
  const ms = zonedToUtc(ev.date, ev.time, ev.tz || LOCAL_TZ);
  const p = partsIn(ms, LOCAL_TZ);
  return {date:p.date, time:p.time, ms};
}

/* ---------- Writes: one at a time per document, whole-document set ---------- */
const chains = new Map();
const timers = new Map();
function enqueue(path, fn){
  const prev = chains.get(path) || Promise.resolve();
  const next = prev.then(fn).catch(e => {
    console.error(e);
    if(e && e.code === "quota_exceeded") toast("存储空间已满：删除一些不需要的职位后再试。");
    else if(e && e.code === "invalid_argument") toast("保存失败：只有这个页面的所有者可以修改数据。");
    else toast("保存失败，请检查网络后再改一次。");
  });
  chains.set(path, next); return next;
}
function save(coll, id, delay=0){
  if(!S.db) return;
  const path = `${coll}/${id}`;
  clearTimeout(timers.get(path));
  const run = () => { timers.delete(path); const doc = S[collKey(coll)].get(id); if(!doc) return;
    enqueue(path, () => S.db.doc(path).set(JSON.parse(JSON.stringify(doc)))); };
  if(delay) timers.set(path, setTimeout(run, delay)); else run();
}
function flushAll(){ for(const [path, t] of timers){ clearTimeout(t); const [coll,id] = path.split("/"); timers.delete(path); const doc = S[collKey(coll)].get(id); if(doc) enqueue(path, () => S.db.doc(path).set(JSON.parse(JSON.stringify(doc)))); } }
function remove(coll, id){ clearTimeout(timers.get(`${coll}/${id}`)); S[collKey(coll)].delete(id); if(S.db) enqueue(`${coll}/${id}`, () => S.db.doc(`${coll}/${id}`).delete()); }
function collKey(c){ return {jobs:"jobs", events:"events", materials:"mats", qa:"qa", meta:"meta"}[c]; }
function patch(coll, id, p, delay=0){
  const cur = S[collKey(coll)].get(id) || {};
  S[collKey(coll)].set(id, {...cur, ...p, updatedAt: nowIso()});
  save(coll, id, delay);
}
window.addEventListener("pagehide", flushAll);
document.addEventListener("visibilitychange", () => { if(document.hidden) flushAll(); });

/* ---------- Derived ---------- */
function jobName(j){ return j ? (j.inst || "未命名职位") : "（已删除的职位）"; }
function jobSub(j){ return [j.dept, j.title, j.city, j.alias && j.alias !== j.inst ? "表格名：" + j.alias : ""].filter(Boolean).join(" · "); }
function matProgress(j){ const r = j.req || {}; let need = 0, done = 0; for(const k in r){ if(r[k] >= 1){ need++; if(r[k] === 2) done++; } } return [done, need]; }
function meterHtml(j){ const [d,n] = matProgress(j); if(!n) return `<span class="meter">—</span>`;
  return `<span class="meter${d===n?" full":""}" title="材料 ${d}/${n}"><i style="--p:${Math.round(d/n*100)}%"></i>${d}/${n}</span>`; }
function statusPill(k){ const s = ST[k] || ST.watch; return `<span class="pill"><span class="dot" style="background:var(--s-${s.k})"></span>${esc(s.l)}</span>`; }
function tminus(dl, status){
  const n = daysUntil(dl);
  if(n === null) return `<div class="tminus none"><b>—</b><small>未定</small></div>`;
  const doneish = status && !EARLY.has(status);
  const md = (d => `${d.getMonth()+1}/${d.getDate()}`)(parseYmd(dl));
  if(n < 0) return `<div class="tminus past" title="${esc(fmtDate(dl))}"><b>已过</b><small>${md}</small></div>`;
  const cls = doneish ? "" : n <= 3 ? "urgent" : n <= 10 ? "soon" : "";
  return `<div class="tminus ${cls}" title="${esc(fmtDate(dl))}"><b>${n === 0 ? "今天" : n + '<span style="font-size:11px;font-weight:500;margin-left:1px">天</span>'}</b><small>${md}</small></div>`;
}
const stars = p => p ? `<span class="stars" aria-label="优先级 ${p}">${"★".repeat(p)}</span>` : "";
const byDeadline = (a,b) => (a[1].deadline || "9999") .localeCompare(b[1].deadline || "9999");

/* ---------- Routing ---------- */
const VIEWS = ["overview","jobs","calendar","materials","prep","prefs"];
function setView(v){ S.view = VIEWS.includes(v) ? v : "overview";
  document.querySelectorAll(".tabs a").forEach(a => a.setAttribute("aria-current", a.dataset.view === S.view ? "page" : "false"));
  render(); window.scrollTo(0,0); }
window.addEventListener("hashchange", () => setView(location.hash.slice(1)));

/* ---------- Render ---------- */
function allLoaded(){ return Object.values(S.loaded).every(Boolean); }
function render(){
  const main = $("#main");
  if(S.denied){ main.innerHTML = `<div class="empty"><strong>这个页面的数据只对所有者开放。</strong>如果你是所有者，请登录后重新打开。</div>`; return; }
  if(!S.db || !allLoaded()){ return; }
  const html = ({overview:vOverview, jobs:vJobs, calendar:vCalendar, materials:vMaterials, prep:vPrep, prefs:vPrefs})[S.view]();
  // Keep focus and caret in text inputs across re-renders
  const a = document.activeElement; const keep = a && main.contains(a) && a.id ? {id:a.id, s:a.selectionStart, e:a.selectionEnd} : null;
  main.innerHTML = html;
  if(keep){ const el = document.getElementById(keep.id); if(el){ el.focus(); try{ el.setSelectionRange(keep.s, keep.e); }catch{} } }
}

/* Overview */
function vOverview(){
  const jobs = [...S.jobs.entries()];
  const counts = Object.fromEntries(STATUSES.map(s => [s.k, 0]));
  jobs.forEach(([,j]) => counts[j.status || "watch"]++);
  const total = jobs.length;
  const activeTotal = total - counts.rejected - counts.skip;

  const bar = STATUSES.filter(s => counts[s.k]).map(s => `<i style="flex:${counts[s.k]};background:var(--s-${s.k})" title="${esc(s.l)} ${counts[s.k]}"></i>`).join("");
  const legend = STATUSES.map(s => `<button type="button" data-goto-status="${s.k}" title="${esc(s.d)}"><b>${counts[s.k]}</b><span><span class="dot" style="background:var(--s-${s.k})"></span>${esc(s.l)}</span></button>`).join("");

  const due = jobs.filter(([,j]) => EARLY.has(j.status||"watch") && (daysUntil(j.deadline) ?? -1) >= 0 && daysUntil(j.deadline) <= 21).sort(byDeadline);
  const dueHtml = due.length ? `<ul class="rows">${due.slice(0,12).map(([id,j]) => `
      <li class="row" data-open-job="${esc(id)}" tabindex="0">
        ${tminus(j.deadline, j.status)}
        <div class="main"><div class="t1">${esc(jobName(j))}</div><div class="t2">${esc(jobSub(j)) || "&nbsp;"}</div></div>
        <div class="side">${statusPill(j.status)}${meterHtml(j)}</div>
      </li>`).join("")}</ul>${due.length > 12 ? `<p class="hint" style="padding:0 16px 12px">还有 ${due.length-12} 个，见“职位”页。</p>` : ""}`
    : `<div class="empty">${total ? "未来三周没有待提交的截止日期。" : "导入职位后，三周内要截止的申请会出现在这里。"}</div>`;

  const now = Date.now();
  const upcoming = [...S.events.entries()].map(([id,e]) => [id,e,evLocal(e)]).filter(([,,l]) => l.ms >= now - 864e5/2 && l.ms <= now + 45*864e5).sort((a,b) => a[2].ms - b[2].ms);
  const evHtml = upcoming.length ? `<div style="padding:4px 16px 16px" class="agenda-items">${upcoming.slice(0,8).map(([id,e,l]) => evCard(id,e,l,true)).join("")}</div>`
    : `<div class="empty">接下来 45 天没有面试或其他日程。<br><button class="btn" type="button" data-new-event>添加日程</button></div>`;

  if(!total) return `
    <div class="view-head"><div><h1>总览</h1><p>${esc(fmtDate(todayStr()))}</p></div></div>
    <div class="panel"><div class="empty"><strong>还没有职位</strong>把公众号文章、官网或 EJM 招聘页的文字或截图交给 AI 识别，或者导入 JOE 文件、手动添加。<br>
      <button class="btn primary" type="button" data-parse>识别招聘信息</button> <button class="btn" type="button" data-import>导入表格</button> <button class="btn" type="button" data-new-job>手动添加</button></div></div>`;

  return `
    <div class="view-head"><div><h1>总览</h1><p>${esc(fmtDate(todayStr()))} · 跟踪中 ${activeTotal} 个职位</p></div>
      <div style="display:flex;gap:8px"><button class="btn" type="button" data-new-job>添加职位</button><button class="btn" type="button" data-new-event>添加日程</button></div></div>
    ${remindersHtml()}
    ${counts.inbox ? `<div class="panel callout"><div><strong>${counts.inbox} 个新职位待筛选</strong><span>来自检索或识别，看一眼决定关注还是不申请。</span></div><button class="btn primary" type="button" data-goto-status="inbox">开始筛选</button></div>` : ""}
    <section class="panel pipeline" aria-label="申请进度">
      <div class="pipe-top"><h2>申请进度</h2><span>共 ${total} 个职位</span></div>
      <div class="pipe-bar">${bar}</div>
      <div class="pipe-legend">${legend}</div>
    </section>
    <div class="grid2">
      <section class="panel"><div class="panel-head"><h2>三周内截止</h2><span class="count">还没提交的职位</span></div>${dueHtml}</section>
      <section class="panel"><div class="panel-head"><h2>接下来的日程</h2><span class="count">时间均为${esc(TZL[LOCAL_TZ] || LOCAL_TZ)}时间</span></div>${evHtml}</section>
    </div>`;
}

/* Jobs */
function lastRunIds(){ const lr = S.meta.get("lastRun"); return lr ? {ids:new Set(lr.addedIds || []), date:lr.date || ""} : {ids:new Set(), date:""}; }
function isNewJob(id, j){
  if((j.status || "watch") !== "inbox") return false;
  const lr = lastRunIds(); if(lr.ids.has(id)) return true;
  const n = j.foundAt ? daysUntil(j.foundAt) : null; return n !== null && n >= -1;
}
function filteredJobs(ignoreStatus){
  const f = S.jobFilter; const q = f.q.trim().toLowerCase(); const lr = lastRunIds();
  let list = [...S.jobs.entries()].filter(([id,j]) => {
    const st = j.status || "watch";
    if(!ignoreStatus){
      if(f.status === "active" && CLOSED.has(st)) return false;
      if(f.status !== "active" && f.status !== "all" && st !== f.status) return false;
    }
    if(f.tag && !(j.tags || []).includes(f.tag)) return false;
    if(f.onlyNew && !(lr.ids.has(id) || (lr.date && j.foundAt === lr.date))) return false;
    if(q){ const hay = [j.inst,j.alias,j.dept,j.title,j.city,j.loc,j.jel,j.kw,j.notes,j.sheetNote,j.section,j.jobType,j.srcType,j.talentPlan,(j.tags||[]).join(" ")].join(" ").toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
  if(f.sort === "deadline") list.sort((a,b) => { const da = daysUntil(a[1].deadline), db = daysUntil(b[1].deadline);
      const ka = da === null ? 1e6 : da < 0 ? 5e5 - da : da, kb = db === null ? 1e6 : db < 0 ? 5e5 - db : db; return ka - kb; });
  if(f.sort === "prio") list.sort((a,b) => (b[1].prio||0) - (a[1].prio||0) || byDeadline(a,b));
  if(f.sort === "updated") list.sort((a,b) => (b[1].updatedAt||"").localeCompare(a[1].updatedAt||""));
  if(f.sort === "name") list.sort((a,b) => jobName(a[1]).localeCompare(jobName(b[1])));
  return list;
}
function badges(id, j){ return (isNewJob(id, j) ? '<span class="newmini">新</span>' : "") + (j.tags || []).map(t => `<span class="tagmini">${esc(t)}</span>`).join(""); }
function dlMini(j){
  const n = daysUntil(j.deadline); if(n === null) return `<span class="dlmini">${esc(j.deadlineNote ? "长期" : "未定")}</span>`;
  if(n < 0) return `<span class="dlmini past">已过</span>`;
  const cls = !EARLY.has(j.status || "watch") ? "" : n <= 3 ? "urgent" : n <= 10 ? "soon" : "";
  return `<span class="dlmini ${cls}">${n === 0 ? "今天" : n + " 天"}</span>`;
}

  const head = `
    <div class="view-head"><div><h1>职位</h1><p>${S.jobs.size} 个职位，当前显示 ${list.length} 个</p></div>

    <div class="toolbar">

      <input type="search" id="job-q" placeholder="搜索学校、城市、标签、笔记" value="${esc(f.q)}" aria-label="搜索职位">
      ${kb ? "" : `<select id="job-status" aria-label="按状态筛选">${opts.map(([k,l]) => `<option value="${k}"${f.status===k?" selected":""}>${esc(l)}</option>`).join("")}</select>`}
      ${TAGS.length ? `<select id="job-tag" aria-label="按标签筛选"><option value="">所有标签</option>${TAGS.map(t => `<option${f.tag===t?" selected":""}>${esc(t)}</option>`).join("")}</select>` : ""}
      ${kb ? "" : `<select id="job-sort" aria-label="排序">${[["deadline","按截止日期"],["prio","按优先级"],["updated","按最近修改"],["name","按学校名"]].map(([k,l]) => `<option value="${k}"${f.sort===k?" selected":""}>${l}</option>`).join("")}</select>`}
      ${f.onlyNew ? `<button class="chip" type="button" data-clear-new aria-pressed="true">只看最近一次检索新增 ✕</button>` : ""}
    </div>`;
  if(!S.jobs.size) return head + `<div class="panel"><div class="empty"><strong>还没有职位</strong>导入表格、识别招聘信息或手动添加。<br><button class="btn primary" type="button" data-import>导入表格</button></div></div>`;
  if(kb) return head + vBoard(list);
  const allSel = list.length && list.every(([id]) => S.sel.has(id));
  const rows = list.map(([id,j]) => `
    <tr data-open-job="${esc(id)}" tabindex="0"${S.sel.has(id) ? ' class="selected"' : ""}>
      <td class="selcell"><input type="checkbox" data-sel="${esc(id)}"${S.sel.has(id) ? " checked" : ""} aria-label="选择 ${esc(jobName(j))}"></td>
      <td class="tm">${tminus(j.deadline, j.status)}</td>

      <td class="c-status">${(j.status||"watch") === "inbox" ? `<span class="triage"><button class="btn sm" type="button" data-triage="watch" data-id="${esc(id)}">关注</button><button class="btn sm ghost" type="button" data-triage="skip" data-id="${esc(id)}">不申请</button></span>` : statusPill(j.status)}</td>
      <td class="c-mat">${meterHtml(j)}</td>

    </tr>`).join("");
  return head + `
    <div class="panel" style="overflow-x:auto">
      ${list.length ? `<table class="jobs-table"><thead><tr><th class="selcell"><input type="checkbox" id="sel-all"${allSel ? " checked" : ""} aria-label="全选当前列表"></th><th>截止</th><th>学校 / 职位</th><th>状态</th><th>材料</th><th>优先级</th></tr></thead><tbody>${rows}</tbody></table>`

      <select data-bulk="prio" aria-label="批量改优先级"><option value="">改优先级…</option>${[3,2,1,0].map(p => `<option value="${p}">${p ? "★".repeat(p) : "清除"}</option>`).join("")}</select>
      ${TAGS.length ? `<select data-bulk="tag" aria-label="批量加标签"><option value="">加标签…</option>${TAGS.map(t => `<option>${esc(t)}</option>`).join("")}</select>` : ""}
      <button class="btn sm danger" type="button" data-bulk-del>删除</button>
      <button class="btn sm ghost" type="button" data-bulk-clear>取消选择</button>
    </div>` : ""}`;
}
function vBoard(list){
  const by = Object.fromEntries(STATUSES.map(x => [x.k, []]));
  list.forEach(([id, j]) => (by[j.status || "watch"] || by.watch).push([id, j]));
  const col = x => {
    const items = by[x.k]; const closed = CLOSED.has(x.k) && !S.kbClosed;
    return `<section class="kcol${closed ? " folded" : ""}" data-col="${x.k}" aria-label="${esc(x.l)}">
      <header class="khead"><span class="dot" style="background:var(--s-${x.k})"></span><b>${esc(x.l)}</b><span class="kcount">${items.length}</span>
        ${CLOSED.has(x.k) ? `<button class="btn ghost sm" type="button" data-kb-fold>${closed ? "展开" : "收起"}</button>` : ""}</header>
      ${closed ? "" : `<div class="kbody">${items.map(([id, j]) => `
        <article class="kcard" draggable="true" data-card="${esc(id)}" data-open-job="${esc(id)}" tabindex="0">
          <div class="kc-top"><span class="kc-inst">${esc(jobName(j))}</span>${dlMini(j)}</div>
          ${j.dept || j.title ? `<div class="kc-sub">${esc([j.dept, j.city].filter(Boolean).join(" · "))}</div>` : ""}
          <div class="kc-foot">${meterHtml(j)}${stars(j.prio)}${badges(id, j)}</div>
          <select class="kc-move" data-move="${esc(id)}" aria-label="把 ${esc(jobName(j))} 移到"><option value="">移到…</option>${STATUSES.filter(y => y.k !== x.k).map(y => `<option value="${y.k}">${esc(y.l)}</option>`).join("")}</select>
        </article>`).join("") || `<div class="kempty">拖到这里</div>`}</div>`}
    </section>`;
  };
  return `<p class="hint" style="margin:-4px 0 10px">拖动卡片到另一列即可改状态；手机上用卡片底部的“移到…”。</p><div class="kanban">${STATUSES.map(col).join("")}</div>`;
}
function setStatusMany(ids, st){
  ids.forEach(id => { if(S.jobs.has(id) && (S.jobs.get(id).status || "watch") !== st) patch("jobs", id, {status:st}); });

/* Calendar */
function evCard(id, e, l, showDate){
  const j = e.jobId ? S.jobs.get(e.jobId) : null; const t = EVT[e.type] || EVT.other;
  const other = e.time && e.tz && e.tz !== LOCAL_TZ ? `<span>${esc(TZL[e.tz] || e.tz)} ${esc(e.time)}</span>` : "";
  return `<div class="ev" data-edit-event="${esc(id)}" tabindex="0">
    <span class="bar" style="background:${t.c}"></span>
    <div><div class="t1">${esc(t.l)}${j ? " · " + esc(jobName(j)) : (e.title ? " · " + esc(e.title) : "")}</div>
      <div class="t2">${esc([e.format, e.place].filter(Boolean).join(" · ")) || "&nbsp;"}</div></div>
    <div class="when">${showDate ? `<b>${esc(fmtDate(l.date))}</b>` : ""}${l.time ? `<b${showDate?' style="font-size:13px;font-weight:500"':''}>${esc(l.time)}</b>` : `<span>全天</span>`}${other}</div>
  </div>`;
}
function shortName(j){ return j ? (j.alias || jobName(j)) : ""; }
function calItems(){
  const out = [];
  for(const [id,e] of S.events){ const l = evLocal(e); if(!l.date) continue; const j = e.jobId ? S.jobs.get(e.jobId) : null; const t = EVT[e.type] || EVT.other;
    out.push({date:l.date, ms:l.ms, chip:`${l.time ? l.time + " " : ""}${t.l}${j ? " " + shortName(j) : (e.title ? " " + e.title : "")}`, color:t.c, html:evCard(id,e,l,false)}); }
  if(S.calDeadlines) for(const [id,j] of S.jobs){ if(!j.deadline || CLOSED.has(j.status||"watch")) continue;
    const early = EARLY.has(j.status || "watch");
    out.push({date:j.deadline, ms:parseYmd(j.deadline).getTime()+1, chip:`截止 ${shortName(j)}`, color: early ? "var(--urgent)" : "var(--faint)", dl:true,
      html:`<div class="ev" data-open-job="${esc(id)}" tabindex="0"><span class="bar" style="background:${early ? "var(--urgent)" : "var(--line)"}"></span>
      <div><div class="t1">申请截止 · ${esc(jobName(j))}</div><div class="t2">${esc(jobSub(j)) || "&nbsp;"}</div></div><div class="when">${statusPill(j.status)}${meterHtml(j)}</div></div>`}); }
  return out.sort((a,b) => a.ms - b.ms);
}
function vCalendar(){

    <div class="toolbar">
      <div class="seg" role="group" aria-label="显示方式"><button type="button" data-calmode="month" aria-pressed="${month}">月历</button><button type="button" data-calmode="agenda" aria-pressed="${!month}">列表</button></div>
      <label class="chip" style="display:inline-flex;gap:6px;align-items:center"><input type="checkbox" id="cal-dl"${S.calDeadlines?" checked":""}> 显示申请截止</label>

    </div>`;
  if(month){
    if(!S.calMonth) S.calMonth = today.slice(0,7);
    const [y, m] = S.calMonth.split("-").map(Number);
    const first = new Date(y, m-1, 1); const offset = (first.getDay() + 6) % 7; const start = new Date(y, m-1, 1 - offset);
    const byDay = {}; items.forEach(it => (byDay[it.date] ||= []).push(it));
    if(!S.calDay || S.calDay.slice(0,7) !== S.calMonth) S.calDay = today.slice(0,7) === S.calMonth ? today : `${S.calMonth}-01`;
    let cells = "";
    for(let i = 0; i < 42; i++){
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i); const ds = ymd(d); const its = byDay[ds] || [];
      cells += `<button type="button" class="mday${d.getMonth() !== m-1 ? " out" : ""}${ds === today ? " today" : ""}${ds === S.calDay ? " picked" : ""}" data-day="${ds}" aria-label="${esc(fmtDate(ds))}，${its.length} 项">
        <span class="mnum">${d.getDate()}</span>
        <span class="mchipz">${its.slice(0,3).map(it => `<span class="mc" style="--c:${it.color}">${esc(it.chip)}</span>`).join("")}${its.length > 3 ? `<span class="mmore">+${its.length - 3}</span>` : ""}</span>
        ${its.length ? `<span class="mdots">${its.slice(0,4).map(it => `<i style="background:${it.color}"></i>`).join("")}</span>` : ""}
      </button>`;
    }
    const dayItems = byDay[S.calDay] || [];
    return head + `
      <div class="panel month">
        <div class="mhead"><button class="btn ghost" type="button" data-cal-nav="-1" aria-label="上个月">‹</button><h2>${y} 年 ${m} 月</h2><button class="btn ghost" type="button" data-cal-nav="1" aria-label="下个月">›</button><button class="btn sm" type="button" data-cal-nav="0">今天</button></div>
        <div class="mgrid"><div class="mw">一</div><div class="mw">二</div><div class="mw">三</div><div class="mw">四</div><div class="mw">五</div><div class="mw">六</div><div class="mw">日</div>${cells}</div>
      </div>

  }
  const shown = items.filter(it => S.calPast ? true : it.date >= today);
  const groups = []; for(const it of shown){ const g = groups[groups.length-1]; if(g && g.date === it.date) g.items.push(it); else groups.push({date:it.date, items:[it]}); }
  const body = groups.length ? groups.map(g => { const n = daysUntil(g.date);
      return `<div class="agenda-day"><div class="agenda-date${n===0?" today":""}"><b>${esc(fmtDate(g.date,false))}</b><span>${WD[parseYmd(g.date).getDay()]}${n===0?" · 今天":n===1?" · 明天":n>1?` · ${n} 天后`:""}</span></div>

  return head + `<div class="panel">${body}</div>`;
}

/* Reminders shown on the overview */
function dismissedSet(){ try { return new Set(JSON.parse(localStorage.getItem("jd-dismiss-" + todayStr()) || "[]")); } catch { return new Set(); } }
function dismiss(key){ const d = dismissedSet(); d.add(key); lsSet("jd-dismiss-" + todayStr(), JSON.stringify([...d])); }
function reminders(){
  const out = []; const dis = dismissedSet(); const now = Date.now();
  const lr = S.meta.get("lastRun");
  if(lr && lr.date && daysUntil(lr.date) >= -1){
    if(lr.added) out.push({key:"run-" + lr.date, lvl:"info", text:`${daysUntil(lr.date) === 0 ? "今早" : "昨天"}的自动检索新增 ${lr.added} 个职位${lr.summary ? "：" + lr.summary : ""}`, act:`<button class="btn sm" type="button" data-show-new>查看</button>`});
    if(lr.issues) out.push({key:"runissue-" + lr.date, lvl:"soon", text:`自动检索遇到问题：${lr.issues}`, act:""});
  }
  for(const [id, j] of S.jobs){
    const st = j.status || "watch"; if(!EARLY.has(st)) continue; const n = daysUntil(j.deadline); if(n === null || n < 0) continue;
    const [d, k] = matProgress(j); const when = n === 0 ? "今天" : n === 1 ? "明天" : n === 2 ? "后天" : `${n} 天后`;
    const open = `<button class="btn sm" type="button" data-open-job="${esc(id)}">打开</button>`;
    if(n <= 3 && st === "prep" && d < k) out.push({key:"mat-" + id, lvl:"urgent", text:`${jobName(j)}${j.dept ? " " + j.dept : ""} ${when}截止，材料还差 ${k - d} 项`, act:open, sort:n});
    else if(n <= 3 && st === "prep") out.push({key:"sub-" + id, lvl:"urgent", text:`${jobName(j)}${j.dept ? " " + j.dept : ""} ${when}截止，材料已齐，提交后把状态改成“已提交”`, act:open, sort:n});
    else if(n <= 7 && (st === "inbox" || st === "watch")) out.push({key:"dec-" + id, lvl: n <= 3 ? "urgent" : "soon", text:`${jobName(j)}${j.dept ? " " + j.dept : ""} ${when}截止，还没决定是否申请`, act:open, sort:n});
  }
  for(const [id, e] of S.events){
    const l = evLocal(e); if(!isFinite(l.ms) || l.ms < now - 3600e3 || l.ms > now + 48 * 3600e3) continue;
    const j = e.jobId ? S.jobs.get(e.jobId) : null; const n = daysUntil(l.date);
    out.push({key:"ev-" + id, lvl:"soon", text:`${n === 0 ? "今天" : n === 1 ? "明天" : n === 2 ? "后天" : fmtDate(l.date)}${l.time ? " " + l.time : ""} ${(EVT[e.type] || EVT.other).l}${j ? " · " + jobName(j) : (e.title ? " · " + e.title : "")}`, act:`<button class="btn sm" type="button" data-edit-event="${esc(id)}">查看</button>`, sort:-1});
  }
  return out.filter(r => !dis.has(r.key)).sort((a, b) => (a.sort ?? -2) - (b.sort ?? -2));
}
function remindersHtml(){
  const rs = reminders(); if(!rs.length) return "";
  return `<section class="panel reminders" aria-label="提醒"><div class="panel-head"><h2>提醒</h2><span class="count">${rs.length} 条</span></div>
    <ul class="rlist">${rs.slice(0, 8).map(r => `<li class="r-${r.lvl}"><span class="rtext">${esc(r.text)}</span><span class="ract">${r.act}<button class="btn ghost sm" type="button" data-dismiss="${esc(r.key)}" aria-label="今天不再提醒">✕</button></span></li>`).join("")}</ul>
    ${rs.length > 8 ? `<p class="hint" style="padding:0 16px 12px;margin:0">还有 ${rs.length - 8} 条，先处理上面的。</p>` : ""}</section>`;
}

let IMP = null;
function loadXlsx(){

  return loadXlsx.p ||= new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; s.onload = res; s.onerror = () => { loadXlsx.p = null; rej(new Error("load")); }; document.head.appendChild(s); });

function importDialog(){
  IMP = null; SHEET = null;
  openDlg(`
    <div class="dlg-head"><h2>导入表格</h2><button class="btn ghost" type="button" data-close-dlg>关闭</button></div>
    <div class="dlg-body" id="imp-body">

      <div class="drop" id="imp-drop">把 .xlsx / .xls / .csv 文件拖到这里，或 <label for="imp-file">选择文件</label><input type="file" id="imp-file" accept=".xls,.xlsx,.csv" hidden></div>

      <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center">

        <button class="btn" type="button" id="imp-paste-go">读取粘贴内容</button>

  const drop = $("#imp-drop"), file = $("#imp-file");
  file.addEventListener("change", () => file.files[0] && readTableFile(file.files[0]));
  drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));

}
async function readTableFile(f){
  const body = $("#imp-body");
  body.innerHTML = `<div class="empty">正在读取 ${esc(f.name)}…</div>`;
  try { await loadXlsx(); } catch { body.innerHTML = `<div class="empty"><strong>表格解析组件没有加载成功。</strong>检查网络后关闭这个窗口再试一次。</div>`; return; }
  let aoa;
  try {
    const wb = XLSX.read(await f.arrayBuffer(), {type:"array"});
    aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, defval:"", raw:true});
  } catch(e){ body.innerHTML = `<div class="empty"><strong>这个文件读不出来。</strong>请确认它是 XLSX、XLS 或 CSV 文件。</div>`; return; }
  routeTable(aoa, f.name);
}
function readPasted(){
  const t = $("#imp-paste").value.replace(/\r/g,"").trim();
  if(!t){ toast("先粘贴表格内容"); return; }
  routeTable(t.split("\n").map(l => l.split("\t")), "粘贴的表格");
}
function routeTable(aoa, name){
  aoa = aoa.filter(r => r.some(c => String(c ?? "").trim() !== ""));
  if(!aoa.length){ $("#imp-body").innerHTML = `<div class="empty"><strong>表格里没有内容。</strong></div>`; return; }
  const hdrIdx = Math.max(0, aoa.slice(0,5).findIndex(r => r.filter(c => Object.values(HDR).some(rx => rx.test(String(c)))).length >= 2 || r.some(c => /^jp_/i.test(String(c)))));
  const head = aoa[hdrIdx].map(c => String(c ?? "").trim());
  if(head.some(c => /^jp_institution$/i.test(c))){
    const rows = aoa.slice(hdrIdx+1).map(r => Object.fromEntries(head.map((h,i) => [h, r[i] ?? ""])));
    readJoe(rows); return;
  }
  sheetStart(head, aoa.slice(hdrIdx+1), name);
}
function normDate(v){
  if(v === null || v === undefined || v === "") return "";
  if(typeof v === "number" && v > 20000 && v < 80000){ const d = new Date(Math.round((v - 25569) * 864e5)); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`; }
  const s = String(v).trim();
  let m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s); if(m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  m = /^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/.exec(s); if(m){ const y = m[3].length === 2 ? "20"+m[3] : m[3]; return `${y}-${pad(m[1])}-${pad(m[2])}`; }
  const t = Date.parse(s); if(!isNaN(t)){ const d = new Date(t); return ymd(d); }
  return "";
}
function readJoe(rows){
  const body = $("#imp-body");
  if(!rows.length){ body.innerHTML = `<div class="empty"><strong>文件里没有数据行。</strong></div>`; return; }
  const keys = Object.keys(rows[0]);
  const find = (...names) => keys.find(k => names.some(n => k.trim().toLowerCase() === n)) || keys.find(k => names.some(n => k.trim().toLowerCase().includes(n)));
  const col = { id:find("jp_id"), title:find("jp_title","title"), inst:find("jp_institution","institution"), dept:find("jp_department","department"),
    div:find("jp_division","division"), section:find("jp_section","section"), kw:find("jp_keywords","keywords"), full:find("jp_full_text","full_text","full text"),
    loc:find("locations","location"), jel:find("jel_classifications","jel"), dl:find("application_deadline","deadline"), issue:find("joe_issue_id","issue") };
  if(!col.inst || !col.title){ body.innerHTML = `<div class="empty"><strong>没找到职位列。</strong>JOE 导出文件应包含 jp_institution 和 jp_title 两列；这个文件的列是：${esc(keys.slice(0,12).join("、"))}。</div>`; return; }
  const g = (r,k) => k ? String(r[k] ?? "").trim() : "";
  const list = rows.map(r => {
    const id = g(r,col.id).replace(/\.0$/,"");
    return { joeId:id, inst:g(r,col.inst), dept:[g(r,col.dept), g(r,col.div)].filter(Boolean).filter((v,i,a) => a.indexOf(v) === i).join(" · "),
      title:g(r,col.title), section:g(r,col.section).replace(/^\d+\.\s*/,""), kw:g(r,col.kw), full:g(r,col.full).slice(0,20000),
      loc:g(r,col.loc), jel:g(r,col.jel), deadline:normDate(col.dl ? r[col.dl] : ""), joeIssue:g(r,col.issue) };
  }).filter(x => x.inst || x.title);
  const sections = [...new Set(list.map(x => x.section).filter(Boolean))].sort();
  IMP = { list, sections, sel:new Set(), q:"", section:"", futureOnly:true, china:true, limit:300 };
  renderImport();
}
function impKey(x){ return x.joeId ? "joe-" + x.joeId.replace(/[^A-Za-z0-9_\-.~:@+]/g,"") : null; }
function impFiltered(){

async function runParse(){
  const go = $("#parse-go"), st = $("#parse-status");

  if(!text && !PARSE.images.length){ st.textContent = "先粘贴招聘原文或添加图片。"; return; }
  PARSE.busy = true; PARSE.ctl = new AbortController(); go.textContent = "停止"; go.classList.remove("primary");
  st.textContent = "AI 正在识别，通常需要 10–60 秒…"; $("#parse-out").innerHTML = "";
  try {
    const opts = {signal:PARSE.ctl.signal}; if(PARSE.images.length) opts.images = PARSE.images;
    const out = await S.sample.json(parsePrompt(text, PARSE.images.length > 0), opts);
    const arr = (Array.isArray(out) ? out : (out && Array.isArray(out.positions) ? out.positions : [])).filter(x => x && typeof x === "object");
    PARSE.results = arr.map(x => ({...x, _keep: x.isMainland !== false}));
    PARSE.text = text;
    st.textContent = arr.length ? `识别出 ${arr.length} 个岗位，检查后保存。` : "没有在这段内容里找到教职岗位。";
    renderParseResults();
  } catch(e){
    st.textContent = e && e.code === "cancelled" ? "已停止。" : (PARSE_ERR[e && e.code] || "识别失败，稍后再试。");
  } finally {
    PARSE.busy = false; go.classList.add("primary"); go.textContent = PARSE.results && PARSE.results.length ? "重新识别" : "识别";
  }
}

    {name:"add_question", description:"往面试题库添加一道题。category 用已有分类。只在用户明确要求时使用。", inputSchema:{type:"object", properties:{question:{type:"string"}, category:{type:"string"}, job_id:{type:"string"}}, required:["question"]},
