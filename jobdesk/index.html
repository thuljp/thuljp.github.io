        save("qa", id); refresh(); note("添加了一道面试题"); return "已添加，id " + id; }},
    {name:"save_answer", description:"把整理好的回答要点保存到题库里的某道题（会替换原有要点，可撤销），并可设置熟练程度 level（0/1/2）。只在用户要求保存时使用。", inputSchema:{type:"object", properties:{question_id:{type:"string"}, answer:{type:"string"}, level:{type:"number"}}, required:["question_id","answer"]},
      execute:(a) => { const id = String(a.question_id); if(!S.qa.has(id)) throw new Error("没有这道题"); recordUndo("qa", id);
        const p = {a:String(a.answer).slice(0, 20000)}; if(a.level !== undefined) p.level = Math.max(0, Math.min(2, Number(a.level)|0));
        patch("qa", id, p); refresh(); note("保存了回答要点"); return "已保存"; }},
  ];
}
function mdLite(t){
  const lines = esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>").split("\n");
  let out = "", list = null;
  for(const ln of lines){
    const m = /^\s*(?:[-•*]|(\d+)[.、])\s+(.*)$/.exec(ln);
    if(m){ const tag = m[1] ? "ol" : "ul"; if(list !== tag){ if(list) out += `</${list}>`; out += `<${tag}>`; list = tag; } out += `<li>${m[2]}</li>`; continue; }
    if(list){ out += `</${list}>`; list = null; }
    if(/^#{1,4}\s+/.test(ln)) out += `<p><b>${ln.replace(/^#{1,4}\s+/, "")}</b></p>`;
    else if(ln.trim()) out += `<p>${ln}</p>`;
  }
  if(list) out += `</${list}>`;
  return out;
}
function aiNote(t){ const cur = AI.msgs[AI.msgs.length - 1]; if(cur && cur.role === "assistant"){ (cur.notes ||= []).push(t); drawAI(); } }

function drawAI(first){
  const root = $("#ai-root"); if(!root) return;

        : `<div class="ai-empty"><p>可以问进度、让它整理计划、写段落，或者模拟面试。它只会在你明确要求时修改数据，改动可以撤销。</p>
            <div class="ai-sugs">${AI_SUGGEST.map(q => `<button class="chip" type="button" data-ai-sug>${esc(q)}</button>`).join("")}</div></div>`}
    </div>

      <button class="btn primary" type="submit" id="ai-send">${AI.busy ? "停止" : "发送"}</button></form>
  </aside>`;

async function sendAI(text){
  if(AI.busy){ AI.ctl && AI.ctl.abort(); return; }
  text = String(text || "").trim(); if(!text) return;
  AI.msgs.push({role:"user", text}); const cur = {role:"assistant", text:"", notes:[]}; AI.msgs.push(cur);
  AI.busy = true; AI.ctl = new AbortController(); AI.turnUndo = 0; const undoStart = AI.undo.length;
  const ta = $("#ai-input"); if(ta) ta.value = ""; drawAI(true);
  const hist = AI.msgs.slice(0, -1).filter(m => m.text).slice(-12).map(m => ({role:m.role, content:m.text}));
  while(hist.length && hist[0].role !== "user") hist.shift();
  const input = [{role:"user", content:aiRules()}, ...hist];
  const useTools = !!(S.sampleLimits && S.sampleLimits.tools);
  try {
    const opts = {signal:AI.ctl.signal, cache:false, onText:({text:t}) => { cur.text = t; drawAI(); }};
    if(useTools){ delete opts.cache; opts.tools = aiTools(); }
    const r = await S.sample(input, opts);
    cur.text = r.text; if(r.truncated) cur.err = "回答太长被截断了，可以让它分几次说。";
  } catch(e){
    cur.text = e && e.text ? e.text : cur.text;
    cur.err = e && e.code === "cancelled" ? "已停止。" : (PARSE_ERR[e && e.code] || (e && e.code === "tools_unavailable" ? "这个视图不能让 AI 操作数据，只能回答问题。" : "出错了，稍后再试。"));
  } finally {
    AI.busy = false; AI.ctl = null;
    const n = AI.undo.length - undoStart; if(n) cur.undo = n, cur.undoFrom = undoStart;
    drawAI();
  }
}
function undoAI(i){
  const m = AI.msgs[i]; if(!m || !m.undo) return;
  const items = AI.undo.splice(m.undoFrom, m.undo).reverse();
  for(const u of items){
    const key = collKey(u.coll);
    if(u.prev){ S[key].set(u.id, u.prev); save(u.coll, u.id); } else remove(u.coll, u.id);
  }
  AI.msgs.forEach(x => { if(x.undoFrom > m.undoFrom) x.undoFrom -= m.undo; });
  m.undo = 0; m.notes = [...(m.notes || []), "已撤销这次的修改"]; refresh(); drawAI(); toast("已撤销");
}

}

    if(kind === "tag") ids.forEach(id => { const j = S.jobs.get(id); const cur = j.tags || []; if(!cur.includes(v)) patch("jobs", id, {tags:[...cur, v]}); });
    toast(`已更新 ${ids.length} 个职位`); render(); return; }
  if(t.matches("[data-move]") && t.value){ const id = t.dataset.move; setStatusMany([id], t.value); toast(`已移到“${ST[t.value].l}”`); render(); return; }
  if(t.matches("[data-map]") && SHEET){ SHEET.map[t.dataset.map] = t.value === "" ? undefined : +t.value; sheetParse(); renderSheet(); return; }
  if(t.matches("[data-sr-keep]") && SHEET){ SHEET.parsed[+t.closest("[data-sr]").dataset.sr].keep = t.checked; renderSheet(); return; }
  if(t.matches("[data-sr-date]") && SHEET){ const r = SHEET.parsed[+t.closest("[data-sr]").dataset.sr]; r.deadline = t.value; r.warn = ""; renderSheet(); return; }
  if(t.matches("[data-sr-target]") && SHEET){ const r = SHEET.parsed[+t.closest("[data-sr]").dataset.sr]; r.target = t.value; r.sure = true; r.how = t.value === "new" ? "" : "手动选择"; renderSheet(); return; }
  if(t.matches("[data-pkeep]")){ PARSE.results[+t.closest("[data-pi]").dataset.pi]._keep = t.checked; return; }
  if(t.matches("[data-pf]") && PARSE && PARSE.results){ PARSE.results[+t.closest("[data-pi]").dataset.pi][t.dataset.pf] = t.value; return; }
  if(t.id === "imp-sec"){ IMP.section = t.value; IMP.limit = 300; renderImport(); return; }
  if(t.id === "imp-future"){ IMP.futureOnly = t.checked; renderImport(); return; }
  if(t.id === "imp-china"){ IMP.china = t.checked; IMP.limit = 300; renderImport(); return; }
  if(t.id === "imp-all"){ impFiltered().forEach(([i]) => t.checked ? IMP.sel.add(i) : IMP.sel.delete(i)); renderImport(); return; }
  if(t.matches("[data-imp]")){ const i = +t.dataset.imp; t.checked ? IMP.sel.add(i) : IMP.sel.delete(i);
    const go = $("#imp-go"); go.disabled = !IMP.sel.size; go.textContent = `导入所选 ${IMP.sel.size} 个职位`; return; }
});

/* ---------- Boot ---------- */
setView(location.hash.slice(1) || "overview");
(async () => {
  const db = window.claude && window.claude.use ? await window.claude.use("db") : null;
  if(!db){ window.__showSetup(); return; }
  S.db = db;
  try { S.downloads = await window.claude.use("downloads"); } catch {}
  try { S.sample = await window.claude.use("sample"); if(S.sample){ S.sampleLimits = await S.sample.limits().catch(() => null); $("#btn-parse").hidden = false; drawAI(); } } catch {}
  const sub = (coll, key) => db.collection(coll).onSnapshot(snap => {
    let changed = false;
    for(const ch of snap.docChanges()){
      const id = ch.doc.id; const path = `${coll}/${id}`;
      if(timers.has(path)) continue; // a local edit is waiting to be saved; it wins
      if(ch.type === "removed"){ S[key].delete(id); changed = true; }
      else { const d = ch.doc.data(); const cur = S[key].get(id); if(!cur || JSON.stringify(cur) !== JSON.stringify(d)){ S[key].set(id, {...d}); changed = true; } }
    }
    const first = !S.loaded[key]; S.loaded[key] = true;
    if(key === "meta" && (first || changed)) applySettings();
    if(first || changed){
      render();
      if(S.drawerJob && key !== "qa"){ const a = document.activeElement; const typing = a && $("#drawer-root").contains(a) && (a.tagName === "TEXTAREA" || a.tagName === "INPUT");
        if(!typing) renderDrawer(false); }
    }
  }, err => { console.error(err); if(err.code === "revoked") { S.denied = true; render(); } else toast("数据同步中断，请刷新页面。"); });
  sub("jobs","jobs"); sub("events","events"); sub("materials","mats"); sub("qa","qa"); sub("meta","meta");
  setTimeout(() => { if(!allLoaded()){ const el = $("#boot"); if(el) el.innerHTML = "<strong>还在等待数据…</strong>如果一直停在这里，你可能不是这个页面的所有者，或者需要刷新。"; } }, 8000);
  setInterval(() => { if(!document.hidden && S.view !== "prep") render(); }, 60 * 60 * 1000); // roll the day over
})();
})();
</script>
